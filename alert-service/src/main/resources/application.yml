server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/tradealert
    username: ${DB_USERNAME:tradealert}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
