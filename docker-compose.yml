services:
  # ============================================================================
  # INFRASTRUCTURE LAYER
  # ============================================================================

  # PostgreSQL Primary (Read/Write)
  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_DB: tradealert
      POSTGRES_USER: tradealert
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tradealert123}
      POSTGRES_INITDB_ARGS: "-c max_wal_senders=10 -c max_replication_slots=10 -c wal_level=replica"
    ports:
      - "5432:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./postgres/primary-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradealert"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    command: >
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on

  # PostgreSQL Standby (Read-Only, Auto-Failover)
  postgres-standby:
    image: postgres:16-alpine
    container_name: postgres-standby
    environment:
      PGUSER: replicator
      POSTGRES_INITDB_ARGS: "-c max_wal_senders=10 -c wal_level=replica"
    ports:
      - "5433:5432"
    volumes:
      - postgres-standby-data:/var/lib/postgresql/data
      - ./postgres/standby-init.sh:/docker-entrypoint-initdb.d/standby-init.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replicator"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - tradealert-network
    command: >
      -c wal_level=replica
      -c max_wal_senders=10
      -c hot_standby=on
      -c hot_standby_feedback=on

  # Redis (Offline notification cache + rate limiting)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tradealert-network
    command: redis-server --appendonly yes --appendfsync everysec

  # ZooKeeper (Kafka coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tradealert-network

  # Kafka (Event backbone)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tradealert-network

  # Prometheus (Monitoring & metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - tradealert-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  # ============================================================================
  # MICROSERVICES LAYER
  # ============================================================================

  # User Service (Authentication & JWT)
  user-service:
    image: user-service:0.0.1-SNAPSHOT
    build:
      context: ./user-service
      dockerfile: src/Dockerfile
    container_name: user-service
    ports:
      - "8080:8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-primary:5432/tradealert"
      SPRING_DATASOURCE_USERNAME: tradealert
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tradealert123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars-long-123456}
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Rate Service (Exchange rate ingestion)
  rate-service:
    image: rate-service:0.0.1-SNAPSHOT
    build:
      context: ./rate-service
      dockerfile: src/Dockerfile
    container_name: rate-service
    ports:
      - "8082:8082"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-primary:5432/tradealert"
      SPRING_DATASOURCE_USERNAME: tradealert
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tradealert123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alert Service (Threshold evaluation)
  alert-service:
    image: alert-service:0.0.1-SNAPSHOT
    build:
      context: ./alert-service
      dockerfile: src/Dockerfile
    container_name: alert-service
    ports:
      - "8084:8084"
    depends_on:
      postgres-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-primary:5432/tradealert"
      SPRING_DATASOURCE_USERNAME: tradealert
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tradealert123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Notification Service (WebSocket delivery + offline queue)
  notification-service:
    image: notification-service:0.0.1-SNAPSHOT
    build:
      context: ./notification-service
      dockerfile: src/Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Verification Service (Email verification)
  verification-service:
    image: verification-service:0.0.1-SNAPSHOT
    build:
      context: ./verification-service
      dockerfile: src/Dockerfile
    container_name: verification-service
    ports:
      - "8085:8085"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-primary:5432/tradealert"
      SPRING_DATASOURCE_USERNAME: tradealert
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tradealert123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Gateway (JWT validation + routing)
  api-gateway:
    image: api-gateway:0.0.1-SNAPSHOT
    build:
      context: ./api-gateway
      dockerfile: src/Dockerfile
    container_name: api-gateway
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars-long-123456}
      JAVA_OPTS: "-Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tradealert-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-primary-data:
    driver: local
  postgres-standby-data:
    driver: local
  redis-data:
    driver: local
  zookeeper-data:
    driver: local
  kafka-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  tradealert-network:
    driver: bridge
