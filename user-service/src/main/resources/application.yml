server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/tradealert
    username: ${DB_USERNAME:tradealert}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}


management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: user-service


